# Builds Evergreen for Windows from the pinned Firefox source and publishes
# the installer and a portable zip as a GitHub release.
#
# Runs on GitHub's Windows runners (no Evergreen servers involved). A build
# from scratch takes about two hours; sccache makes later builds faster.
#
# Two jobs: `build` compiles and packages, then uploads the packages;
# `test-and-publish` smoke-tests the packaged browser and publishes it. To
# re-test or re-publish an earlier build without compiling again, run the
# workflow with `from_run` set to that run's ID.
name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release when the build and smoke test pass"
        type: boolean
        default: true
      from_run:
        description: "Skip the build: test and publish the packages of this earlier run ID"
        required: false
        default: ""
  push:
    tags: ["v*"]  # v<Evergreen version>, e.g. v0.1 (must match VERSION)

permissions:
  contents: write  # to publish releases
  actions: read    # to download packages from an earlier run (from_run)

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  EG_WORK_DIR: C:\eg
  MOZBUILD_STATE_PATH: C:\mozbuild

jobs:
  build:
    name: Build Evergreen for Windows
    if: ${{ !inputs.from_run }}
    runs-on: windows-latest
    timeout-minutes: 355
    env:
      EG_EXTRA_MOZCONFIG: ${{ github.workspace }}\mozconfigs\ci.mozconfig
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Release version
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $firefox = (Get-Content upstream.json | ConvertFrom-Json).firefox.version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION (v$version)"
          }
          "Evergreen $version, built on Firefox $firefox"

      - name: Runner resources
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfLogicalProcessors | Format-List
          "{0:N1} GB RAM" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Free GB'; e={[math]::Round($_.Free / 1GB, 1)}}

      - name: Keep Windows Defender out of the build directories
        run: |
          New-Item -ItemType Directory -Force C:\eg, C:\mozbuild | Out-Null
          Add-MpPreference -ExclusionPath 'C:\eg', 'C:\mozbuild', 'C:\mozilla-build' -ErrorAction SilentlyContinue

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MozillaBuild (Mozilla's Windows build environment)
        run: |
          $setup = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/S', '/D=C:\mozilla-build' -Wait
          if (-not (Test-Path C:\mozilla-build\msys2\usr\bin\bash.exe)) { throw "MozillaBuild did not install" }
          Get-Content C:\mozilla-build\VERSION -ErrorAction SilentlyContinue

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Fetch and verify the Firefox source
        run: python eg.py fetch

      - name: Prepare the Evergreen source tree
        run: python eg.py prepare --platform windows

      - name: Fetch uBlock Origin (bundled)
        run: python eg.py fetch-extensions --pin

      - name: Build
        shell: cmd
        env:
          MOZILLABUILD: C:\mozilla-build\
          CHERE_INVOKING: "1"
        run: C:\mozilla-build\msys2\usr\bin\bash.exe --login -c "python3 eg.py build"

      # On Windows, Firefox's `make package` builds the portable zip and,
      # from it, the NSIS installer.
      - name: Package (portable zip and installer)
        shell: cmd
        env:
          MOZILLABUILD: C:\mozilla-build\
          CHERE_INVOKING: "1"
        run: C:\mozilla-build\msys2\usr\bin\bash.exe --login -c "python3 eg.py package"

      - name: Collect release files
        run: python eg.py collect --platform windows --out release

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-windows
          path: release/
          if-no-files-found: error

      - name: Gather diagnostics
        if: always()
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $tree = Get-ChildItem C:\eg\src -Directory -Filter "firefox-*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tree) {
            Copy-Item "$($tree.FullName)\mozconfig" diagnostics\ -ErrorAction SilentlyContinue
            Copy-Item "$($tree.FullName)\obj-evergreen\config.log" diagnostics\ -ErrorAction SilentlyContinue
            Get-ChildItem "$($tree.FullName)\obj-evergreen\dist" -ErrorAction SilentlyContinue |
              Format-Table Name, Length -AutoSize | Out-String -Width 200 | Set-Content diagnostics\dist-listing.txt
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

  test-and-publish:
    name: Smoke test and publish
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.from_run != '')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: evergreen-windows
          path: release
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Keep Windows Defender out of the test directory
        run: |
          New-Item -ItemType Directory -Force C:\eg | Out-Null
          Add-MpPreference -ExclusionPath 'C:\eg' -ErrorAction SilentlyContinue

      - name: Smoke test the packaged browser
        run: |
          Get-ChildItem release | Format-Table Name, Length -AutoSize
          $zip = Get-ChildItem release\*-portable.zip | Select-Object -First 1
          if (-not $zip) { throw "No portable zip among the packages" }
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" $zip.FullName C:\eg\pkg
          $exe = Get-Item C:\eg\pkg\evergreen\evergreen.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            Get-ChildItem C:\eg\pkg -Recurse -Depth 1 | Select-Object -ExpandProperty FullName
            throw "evergreen\evergreen.exe is not in $($zip.Name)"
          }
          "Bundled extensions:"
          Get-ChildItem C:\eg\pkg\evergreen\distribution\extensions -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          python tests/smoke/smoke_test.py --binary $exe.FullName --headless --screenshots C:\eg\dev\screenshots

      # Opens the installer and checks its windows (Evergreen's name and
      # image, not Firefox's); installs nothing.
      - name: Check the installer
        run: |
          $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer among the packages" }
          ./tests/installer/check_installer.ps1 -Setup $setup.FullName -OutDir C:\eg\dev\installer-ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Again on a scaled display, as on most laptops.
          ./tests/installer/check_installer.ps1 -Setup $setup.FullName -OutDir C:\eg\dev\installer-ui -Scale 150

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            C:\eg\dev\screenshots\
            C:\eg\dev\smoke-firefox.log
            C:\eg\dev\installer-ui\
          if-no-files-found: ignore

      - name: Publish GitHub release
        if: success() && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $firefox = (Get-Content upstream.json | ConvertFrom-Json).firefox.version
          if (-not (Test-Path "release\Evergreen-$version-win64-portable.zip")) {
            throw "The packages are not Evergreen $version's (VERSION changed since that build?)"
          }
          # The commit the packages were built from.
          $sha = $env:GITHUB_SHA
          if ($env:FROM_RUN) {
            $sha = gh run view $env:FROM_RUN --repo $env:GITHUB_REPOSITORY --json headSha --jq .headSha
          }
          $runId = if ($env:FROM_RUN) { $env:FROM_RUN } else { $env:GITHUB_RUN_ID }
          $notes = (Get-Content .github\release-notes.md -Raw) `
            -replace '@VERSION@', $version `
            -replace '@FIREFOX@', $firefox `
            -replace '@SHA@', $sha `
            -replace '@REPO_URL@', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" `
            -replace '@RUN_URL@', "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$runId" `
            -replace '@SHA256SUMS@', (Get-Content release\SHA256SUMS.txt -Raw).Trim()
          if (-not (Test-Path release\*-setup.exe)) {
            # No installer among the packages; do not advertise one.
            $notes = $notes -replace '(?m)^\| `Evergreen-[^`]*-setup\.exe`.*\r?\n', ''
          }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $files = Get-ChildItem release\* | ForEach-Object { $_.FullName }
          # A numbered release (shown as the repository's latest). A version is
          # published once; bump VERSION for the next release.
          $title = "Evergreen $version for Windows"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            gh release create $env:GITHUB_REF_NAME @files --title $title --notes-file release-notes.md --verify-tag
          } else {
            gh release create "v$version" @files --title $title --notes-file release-notes.md --target $sha
          }
